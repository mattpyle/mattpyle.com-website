[project]
name = "mattpyle-benchmark"
version = "0.1.0"
description = "Agent-task benchmark rig: one agent, one task, one entry route, measured."
requires-python = ">=3.11"
dependencies = [
    "temporal-agent-harness[pydantic-ai]",
    "pydantic-ai-slim[anthropic,google,temporal]>=2.13",
    "httpx>=0.27",
]

[project.scripts]
benchmark-run = "benchmark.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.4",
]

[tool.uv.sources]
temporal-agent-harness = { git = "https://github.com/temporal-community/temporal-agent-harness.git", branch = "main" }

[tool.uv]
# The harness pins `temporalio` to an unreleased sdk-python commit, and uv applies that source pin
# downstream: without this override a plain install tries to build the Rust core bridge from source
# and fails on any machine without a C/Rust toolchain. Nothing here needs the unreleased feature
# the pin exists for. Drop this line once the harness pin goes away.
override-dependencies = ["temporalio==1.31.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["benchmark"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
