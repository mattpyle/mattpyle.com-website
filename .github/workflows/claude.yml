name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # The fixer reads git log for dates the tree does not hold.
          fetch-depth: 0

      # The same preparation as the "Site tests & astro check" job in ci.yml, so the
      # checks Claude runs before it pushes are the checks CI runs after.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate content collection types
        run: npx astro sync

      # `npm run look` opens the built pages in Playwright's Chromium. The browser is cached by
      # the resolved @playwright/test version, as in .github/actions/serve-built-site; the
      # system libraries land in /usr/lib and are not ours to cache, so a hit installs those alone.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium
        env:
          BROWSER_CACHED: ${{ steps.playwright-cache.outputs.cache-hit }}
        run: |
          if [ "$BROWSER_CACHED" = 'true' ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # The fix issue Steward opens is authored by its GitHub App, and the Action
          # refuses a bot actor unless it is named here. Use the app's slug, the one
          # in the hosted worker's ready line (`github: app <slug> installation <id>`).
          # The Action accepts it with or without the `[bot]` suffix. Nothing else
          # is allowed.
          allowed_bots: steward-mattpyle

          # Claude may run the repository's own checks, look at the built pages and open the PR
          # itself. Nothing else on the shell is allowed. What is fenced: `npm run look`'s browser
          # loads site paths from the local build only, reaches no other origin and sees no drafts.
          # What is not: `npm run look` builds the site, and `npm test` runs the test suite, and
          # both run repository code the fixer may have edited, with the job's network. That was
          # already true of `npm test`.
          claude_args: |
            --allowedTools "Bash(npm test:*),Bash(npm run check:*),Bash(npm run look:*),Bash(gh pr create:*),Bash(git log:*)"
            --append-system-prompt "Look before and after. Before your first edit, run npm run look -- --label before, with each page your change will reach and --find with the text you will change. Before you push, run npm test and npm run check and leave both passing, then run npm run look -- --label after with the same pages and --find with the changed text. For every change, read the text, the rendered HTML, the markdown twin and the two aimed pictures each look leaves. If the after look fails because the --find text is not on the page, the text you wrote did not render as written: fix that before you push. This run keeps the .look folder as an artefact at ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}: link it in the pull request, and say which pages you looked at, at which widths, before and after. On a round where npm is refused, push, read the CI result, and say in the pull request that you could not look. When the fix is pushed, open the pull request yourself with gh pr create against master. The PR body is public and short: what changed, why, and the evidence. When you push a commit to a pull request that Steward has tested, Steward tests the new commit on its preview by itself and clears a draft it set, so do not tell anyone to run a retest or to mark the pull request ready."

      # The pictures the fixer took, before and after its edit, kept with the run so its pull
      # request can link them and a reader can check what it says it looked at. Hidden-file
      # inclusion because `.look/` starts with a dot.
      - name: Keep the look pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: look-${{ github.run_id }}-${{ github.run_attempt }}
          path: .look/
          include-hidden-files: true
          if-no-files-found: ignore
