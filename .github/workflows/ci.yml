name: CI (tests & typecheck)

# The unit tests and both typecheckers, which until now ran only on Matt's
# machine. `a11y.yml` already ran `npm run build`, so the three build-time
# validators (assert-no-drafts, validate-sitemap, validate-article-actions) were
# covered indirectly — but the ~450 unit tests and the behavioural workflow
# coverage were not, and could merge without ever executing.
#
# Deliberately separate from a11y.yml: this job needs no browser and no built
# site, so it finishes in a fraction of the time and reports on its own.
#
# Routing. On a pull request, the `changes` job lists the files the PR changes
# (`git diff --name-only` against the base commit, the same fetch the "Show
# generated data diff" step uses) and sorts them into the three outputs below.
# The sorting is `scripts/route-changes.sh`, which `a11y.yml` calls too, so its
# `axe` job follows the `site` rule below. A change to a row is an edit to that
# script plus this table.
# A fourth output, `steward_tests`, says how the Steward job picks its tests.
# Each suite then runs only when its output is true. A push to `master` skips
# the diff and runs `steward` and `site`, so master timings and the drift checks
# that read master runs stay comparable. It leaves `browser` false: the pull
# request already ran it, and it takes minutes.
# The Vercel preview build follows the `site` column too: `ignoreCommand` in
# `vercel.json` runs `scripts/vercel-ignore.sh`, which skips a preview when
# `site` is false and builds in every other case, errors included. JSON has no
# comments, so the reason lives here: a preview that cannot change the site
# costs a build and adds nothing to review.
#
#   Changed file                                        steward  site  browser
#   Markdown outside src/content/ and
#     agents/steward/src/                               no       no    no
#   agents/steward/** (not Markdown outside
#     agents/steward/src/)                              yes      no    no
#   agents/steward/src/lib/agent-audit/**, and
#     agents/steward/package.json                        yes      yes   yes
#   agents/steward/src/lib/audit-engine.ts,
#     agents/steward/src/lib/chrome-probe.ts,
#     agents/steward/Dockerfile                          yes      no    yes
#   package-lock.json, .github/workflows/ci.yml,
#     scripts/route-changes.sh,
#     scripts/select-steward-tests.mjs,
#     scripts/vercel-ignore.sh                           yes      yes   yes
#   src/content/**, src/data/**, package.json            yes      yes   no
#   anything else outside agents/steward/                no       yes   no
#
#   Change                                              steward_tests runs
#   a push to master                                     tests/**
#   outside agents/steward/ and setting `steward`        tests/**
#   agents/steward/tests/helpers/** or tests/fixtures/**,
#     agents/steward/package.json, any tsconfig,
#     a non-TypeScript file nothing in a TypeScript
#     folder owns (a rubric, a Vale style, a script)     tests/**
#   only under agents/steward/src/console/ or
#     agents/steward/tests/console/, assets included     tests/console/**
#   any other file under agents/steward/                 the test files whose imports reach it
#   a change under agents/steward/src/workflows/         the same, plus tests/workflows/replay.test.ts
#   a change no test reaches                             nothing; the typecheck is the check
#   a change that sets `browser`                         the same, plus the real-Chrome test
#
# Why those rows. Steward tests the published content and the scorecard data,
# so those paths and the shared lockfile and workflow file run it. The site
# imports Steward's two export entries (tests/steward-*-packaging.test.mjs), so
# a change to either entry's graph is a site change. Markdown under src/content/
# is content, not documentation.
#
# The `steward_tests` rows. A change confined to the findings console runs
# `tests/console/**` and the typecheck: the console is an island that the CLI
# loads on demand and whose assets its tests read by path, so the graph would
# only add the CLI tests. Every other change under `agents/steward/` goes to
# `scripts/select-steward-tests.mjs`, which builds the import
# graph of `agents/steward/` with TypeScript's own program, so an import resolves
# as `tsc` resolves it, and selects every test whose runtime imports reach a
# changed file. Type-only imports do not count: `tsx` erases them and the
# typecheck, which runs in every case, still sees them. The graph misses what a
# test names as a string (the workflow bundle's entry, the CLI a test spawns, a
# file read as text); the script's header says how it covers those. The full
# suite stays for what every test process loads: the helpers, the fixtures, the
# install and the compiler options. The replay suite rides with a workflow
# change because its fixtures guard command sequences, which no import shows.
# When a selection is empty the test step is skipped and the job log says so.
# Run the same selection locally: the header of the script and "The test suite" in
# `agents/steward/CLAUDE.md`.
#
# The script runs in the Steward job, after its `npm ci`, because it needs the
# installed `typescript`. The routing job only writes `steward_tests=select` and
# the changed files, so it installs nothing and a docs-only pull request pays
# nothing for the selection. If the script fails, the job warns and runs the
# full suite.
#
# A change to the routing scripts runs every suite, so a routing mistake is
# caught by the suites it would have skipped.
#
# The `browser` row. `browser` makes the Steward job's test step set
# `STEWARD_CHROME_TESTS=1`, which turns on the one test that launches a real
# Chrome (`tests/lib/agent-audit-deep-chrome.test.ts`). It proves the deep
# audit's browser honours the vetting proxy and the address policy, a property
# the fake-runner tests cannot show. So it runs for a change to the browser
# runners and the proxy and policy beside them (`agent-audit/**`,
# `audit-engine.ts`, `chrome-probe.ts`), to the dependencies that supply the
# browser tooling (`package.json`, `package-lock.json`) and to the container
# that ships it (`Dockerfile`). A change to this file runs it too, so a routing
# mistake here is seen on the PR that makes it. The runner's preinstalled
# `google-chrome-stable` is the browser (see the note in `a11y.yml`), so the job
# installs none.
#
# Open decision on scorecard and fixer PRs (card STW-510): the paths answer it.
# A scorecard PR changes src/data/ and runs both suites. A fixer PR that changes
# only pages, components or styles under src/ runs the site suite and skips
# Steward; one that also changes src/content/ or src/data/ runs both.
#
# A skipped job is skipped by a job-level `if`, not by `on.paths`, so it shows
# as skipped on the PR instead of vanishing. The only required check on
# `master` is "Private paths not tracked" (ruleset `protect-master`), so a
# skipped job blocks no merge. Whoever makes `site` or `steward` required must
# first give the PR an always-reporting check that sits beneath this routing.

on:
  push:
    branches: [master]
  pull_request:

# No job here writes through the token: it checks out, installs, typechecks and
# runs tests. Stated explicitly rather than inherited, matching security-scan.yml.
permissions:
  contents: read

jobs:
  changes:
    name: Route by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.route.outputs.site }}
      steward: ${{ steps.route.outputs.steward }}
      browser: ${{ steps.route.outputs.browser }}
      steward_tests: ${{ steps.route.outputs.steward_tests }}
      steward_changed: ${{ steps.route.outputs.steward_changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sort changed files into site, steward, browser and the Steward test rule
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/route-changes.sh "$EVENT_NAME" "$BASE_SHA"

  site:
    name: Site tests & astro check
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `astro check` needs the generated types under .astro/, which `astro
      # sync` writes. `npm ci` alone does not produce them on a fresh clone.
      - name: Generate content collection types
        run: npx astro sync

      - name: Typecheck (astro check)
        run: npm run --silent check

      - name: Run site tests
        run: npm test

      # `src/data/a2a-digest.json`, `agent-skills-index.json` and `page-paths.mjs`
      # are gitignored: `pretest` and `precheck` generate them. A pull request's
      # own diff therefore no longer shows what an agent will be told, so this
      # step generates the three files on the base commit as well and writes the
      # difference to the job summary. The base worktree has no `npm ci`: the
      # generators must import only `node:` builtins and repo files, and
      # tests/generator-imports.test.mjs holds that rule for the head. A base
      # that predates the rule cannot run its generators; the step then writes
      # one line saying so and stays green. The head's own generators and the
      # summary script still fail the job. The generators are run directly, not
      # through `npm run generate`, because an older base has no such script.
      # `!cancelled()` keeps the summary when a test fails, which is when a
      # reviewer wants it.
      - name: Show generated data diff
        if: github.event_name == 'pull_request' && !cancelled()
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
          base_ok=true
          for generator in a2a-digest agent-skills-index page-paths; do
            node "$RUNNER_TEMP/base/scripts/generate-$generator.mjs" || base_ok=false
          done
          if [ "$base_ok" != true ]; then
            echo "Generated data diff skipped: the base commit's generators could not run without an install." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          node scripts/summarise-generated-diff.mjs "$RUNNER_TEMP/base" . >> "$GITHUB_STEP_SUMMARY"

  steward:
    name: Steward tests & tsc
    needs: changes
    if: needs.changes.outputs.steward == 'true'
    runs-on: ubuntu-latest
    # The suite takes 3 to 4 minutes. A hung test fails in one under the test
    # script's --test-timeout; this bounds a hang outside a test, such as the
    # install or the Temporal binary download, well short of the 6-hour default.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `steward_tests` from the routing job is the full glob, the console glob, or
      # `select`. For `select` this runs the graph script on the changed files; its
      # reasons print above the answer. The output `tests` is then the glob, a
      # space-separated list, or empty. Browser changes add the real-Chrome test,
      # which a Dockerfile change reaches through no import. A failure of the script
      # runs the full suite: a selector that breaks must not skip tests.
      - name: Select Steward tests
        id: select
        env:
          STEWARD_TESTS: ${{ needs.changes.outputs.steward_tests }}
          STEWARD_CHANGED: ${{ needs.changes.outputs.steward_changed }}
          BROWSER: ${{ needs.changes.outputs.browser }}
        run: |
          tests="$STEWARD_TESTS"
          if [ "$STEWARD_TESTS" = select ]; then
            flags=()
            [ "$BROWSER" = true ] && flags+=(--browser)
            if ! tests="$(printf '%s\n' "$STEWARD_CHANGED" | node scripts/select-steward-tests.mjs "${flags[@]}")"; then
              echo "::warning::select-steward-tests.mjs failed; running the full Steward suite"
              tests='tests/**/*.test.ts'
            fi
          fi
          if [ -z "$tests" ]; then
            label='none, typecheck only'
          elif [[ "$tests" == *'*'* ]]; then
            label="$tests"
          else
            label="$(wc -w <<< "$tests" | tr -d ' ') selected files"
          fi
          echo "tests=$tests" >> "$GITHUB_OUTPUT"
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "Steward tests: $label"

      # The workflow suites start a time-skipping Temporal server, whose binary
      # is NOT bundled in @temporalio/testing — it is downloaded on first use.
      # Left at the SDK default (system temp, 1-day TTL) that download happens on
      # every CI run, making a green suite dependent on a third-party fetch.
      # `tests/helpers/test-env.ts` pins the cache here so this step can restore
      # it; the key carries the lockfile hash so an SDK bump re-downloads.
      - name: Restore Temporal test server binary
        if: steps.select.outputs.tests != ''
        uses: actions/cache@v4
        with:
          path: ~/.cache/steward/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Typecheck (tsc --noEmit)
        run: npm run --silent check:steward

      # `browser` from the routing job: `1` turns on the real-Chrome test in
      # `agent-audit-deep-chrome.test.ts`, on the runner's preinstalled Chrome;
      # empty leaves it skipped. The header table says which changes set it.
      #
      # The `select` step's `tests` is the list of test files to run, or a glob;
      # the step name says which. The flags are those of the `test` script
      # in `agents/steward/package.json`; keep the two in step. The credential
      # guard stays: without it two tests in `tests/lib` fail. The value is split
      # on spaces into an array, so each file or the glob reaches node as one
      # argument and node, not the shell, expands the glob.
      - name: Run Steward tests (${{ steps.select.outputs.label }})
        if: steps.select.outputs.tests != ''
        working-directory: agents/steward
        env:
          STEWARD_CHROME_TESTS: ${{ needs.changes.outputs.browser == 'true' && '1' || '' }}
          STEWARD_TESTS: ${{ steps.select.outputs.tests }}
        run: |
          read -ra tests <<< "$STEWARD_TESTS"
          echo "Steward tests (${#tests[@]}): $STEWARD_TESTS"
          node --import tsx --import ./tests/helpers/no-real-credentials.ts --test --test-concurrency=4 --test-timeout=60000 "${tests[@]}"

      - name: No Steward test reaches this change
        if: steps.select.outputs.tests == ''
        run: echo "No Steward test imports a file this change touches, so the typecheck above is the whole Steward check."

  # TEMPORARY (STW-595): reproduce the merge-and-retest stall on a runner.
  # Removed before the pull request is marked ready.
  stall-loop:
    name: TEMPORARY stall loop
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ~/.cache/steward/temporal-test-server
          key: temporal-test-server-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Merge-and-retest beside the merge-timeout test, up to 20 times
        working-directory: agents/steward
        run: |
          flags=(--import tsx --import ./tests/helpers/no-real-credentials.ts --test --test-concurrency=4 --test-timeout=60000)
          load() { node "${flags[@]}" --test-name-pattern='a PR nobody merges' tests/workflows/finding-lifecycle.test.ts > /dev/null 2>&1; }
          start=$SECONDS; runs=0; failed=0; l1=; l2=
          while [ $runs -lt 20 ] && [ $((SECONDS - start)) -lt 480 ]; do
            if [ -z "$l1" ] || ! kill -0 "$l1" 2>/dev/null; then load & l1=$!; sleep 3; fi
            if [ -z "$l2" ] || ! kill -0 "$l2" 2>/dev/null; then load & l2=$!; fi
            runs=$((runs + 1)); t0=$SECONDS
            # `|| code=$?`: the step runs under bash -e, and a bare failing
            # command would end the loop before the failure is printed.
            code=0
            timeout 90 node "${flags[@]}" --test-name-pattern='a merge and a retest' tests/workflows/finding-retest.test.ts > run.log 2>&1 || code=$?
            echo "run $runs: exit $code in $((SECONDS - t0)) s"
            if [ $code -ne 0 ]; then
              failed=$((failed + 1))
              echo "::group::run $runs failure"
              awk '/failing tests:/,0' run.log | grep -v '^ *at ' || true
              grep -n 'Error while completing\|Cannot close' run.log || true
              echo "::endgroup::"
            fi
          done
          kill $l1 $l2 2>/dev/null || true
          echo "STALL LOOP: $failed of $runs runs failed, $((SECONDS - start)) s"
          [ $failed -eq 0 ]
