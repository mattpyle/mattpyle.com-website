name: Built-site checks (axe-core, HTML validity, llms.txt)

# Everything that needs a real production build served over HTTP, sharing one build and one
# server. The accessibility audits came first and are still the bulk of it; the HTML validity run
# and the llms.txt conformance assertion joined on 2026-08-17 because they need exactly the same
# two things and a second job would pay for a second build to get them.
#
# Which steps gate: the two axe runs and the audit-url report scan. The Playwright guard, the
# HTML validity run and the llms.txt assertion are advisory — red on the PR, deploys proceed —
# in the same spirit as spellcheck.

on:
  push:
    branches: [master]
  pull_request:

# The job builds the site, serves it locally and audits it; nothing writes
# through the token. Stated explicitly rather than inherited, matching
# security-scan.yml. The gating @axe step reports as a check run, which needs no
# token permission of its own.
permissions:
  contents: read

jobs:
  axe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      # The Nu HTML Checker is a Java program. `vnu-jar` pins the jar itself as a devDependency,
      # but not the runtime it needs — ubuntu-latest ships one preinstalled and the version it
      # ships is not ours to depend on, so it is declared here like every other tool version in
      # this workflow. Temurin 21 because Nu needs 8 or newer and 21 is the current LTS.
      - name: Setup Java (for the Nu HTML Checker)
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # ubuntu-latest ships a preinstalled google-chrome-stable specifically for
      # browser-automation workflows like this one (see actions/runner-images).
      # DETECT_CHROMEDRIVER_VERSION makes the `chromedriver` npm package (a
      # transitive dependency of @axe-core/cli) look up that exact binary and
      # download a matching driver, instead of installing whatever chromedriver
      # happens to be tagged "latest" on npm — which can silently drift out of
      # sync with the runner's actual Chrome version.
      - name: Install dependencies
        env:
          DETECT_CHROMEDRIVER_VERSION: 'true'
        run: npm ci

      - name: Print Chrome & chromedriver versions
        run: |
          google-chrome-stable --version
          npx chromedriver --version

      # Playwright downloads a pinned Chromium build per release, so the cache
      # key has to be the resolved @playwright/test version, not the range in
      # package.json. A bump to a release with a newer Chromium must miss the
      # cache, or the guard runs against a browser the runner's Playwright does
      # not support and fails for a reason that has nothing to do with the PR.
      - name: Resolve Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      # The browser binary is cached; the system libraries it links against are
      # not, because they land in /usr/lib and are not ours to cache. On a hit,
      # install-deps alone; on a miss, both.
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Build site
        run: npm run build

      # The Vercel adapter (added for the on-demand /writing/<slug>.md route)
      # puts astro build into hybrid "server" mode, which nests prerendered
      # static output under dist/client/ instead of writing straight into
      # dist/ — serve dist/client, not dist, or every route here 404s.
      #
      # Not `npx serve` any more: /activity renders on demand (it reads the hit
      # store per request), so a static server 404s one of the nine routes
      # audited below. serve-built-site.mjs serves the same directory and falls
      # back to the adapter's render function, which is the ordering Vercel
      # itself uses. /scorecard was the on-demand route until 2026-08-22, when
      # the store read moved to /activity and it went back to prerendering.
      #
      # AGENT_TRAFFIC_FIXTURE makes /activity render its tables rather than its
      # store-unavailable state, so axe actually scans the markup that ships. No
      # store exists on a runner, and never should.
      - name: Serve built site
        env:
          AGENT_TRAFFIC_FIXTURE: '1'
        run: node scripts/serve-built-site.mjs --port 4321 &

      - name: Wait for local server
        run: npx wait-on http://localhost:4321 --timeout 30000

      # No --browser flag: omitting it is how @axe-core/cli selects headless
      # Chrome (the only mode that launches on a display-less runner). Passing
      # the literal string "chrome-headless" is NOT a valid --browser value —
      # parseBrowser() only accepts chrome/firefox/ie/safari/edge and throws
      # "Unknown browser" on anything else; "chrome-headless" is purely the
      # internal default it falls back to when the flag is absent.
      - name: Run axe-core accessibility audit
        run: |
          npm run --silent a11y:axe -- \
            --exit \
            http://localhost:4321/ \
            http://localhost:4321/about \
            http://localhost:4321/writing \
            http://localhost:4321/projects \
            http://localhost:4321/scorecard \
            http://localhost:4321/activity \
            http://localhost:4321/steward \
            http://localhost:4321/webmcp \
            http://localhost:4321/writing/accessibility-and-ai/

      # The CLI step above audits what the server sends, which is always modern: retro is a
      # persisted client-side preference, and @axe-core/cli has no hook to run a script before it
      # scans. So the site's second appearance — the one carrying the guest book, the webmaster note
      # and the web ring, all `display: none` in modern — is audited here instead, by
      # @axe-core/playwright, same axe-core 4.12.1, against this job's
      # build on this job's server. Gating, not advisory: this is a real axe run, it is just driven
      # by a browser that can set localStorage before the first paint.
      #
      # if: always() for the same reason the guard step below has it. --grep @axe selects only this
      # spec, and the guard step's --grep-invert drops it, so the scan runs once per workflow.
      - name: Run axe-core accessibility audit (retro appearance)
        if: always()
        env:
          A11Y_REUSE_SERVER: '1'
        run: npm run --silent a11y:run -- --grep @axe

      # The deterministic WCAG checks axe and Lighthouse defer to manual review:
      # keyboard order, focus visibility, ClientRouter focus, 320px reflow,
      # reduced motion, and self-animation on load (the one that made the axe
      # step above flake). The specs are in tests/a11y/, one file per check, and
      # each carries what it asserts and why in its own docblock.
      #
      # if: always() because the axe step runs with --exit. Without it a red axe
      # ends the job here and the PR never learns whether the guard also broke;
      # splitting them into two jobs would cost a second build instead.
      #
      # a11y:run, not a11y: the build above is this commit's build, already
      # served on 4321. A11Y_REUSE_SERVER tells playwright.config.ts to use that
      # server rather than start a second one on the same port and fail.
      #
      # --grep-invert drops two families. @golden is the aria snapshots: they match their golden as
      # a subset, so they are blind to additions and belong on the scorecard with a human reading
      # the diff, not on a per-PR gate. @axe is the retro scan, which already ran as its own gating
      # step above; leaving it in would scan every retro route twice and report a real axe violation as
      # an advisory one.
      - name: Run accessibility guard checks (Playwright)
        if: always()
        env:
          A11Y_REUSE_SERVER: '1'
        run: npm run --silent a11y:run -- --grep-invert "@golden|@axe"

      # Steward's `audit-url` HTML report is a page this repo ships too, and an
      # agent-readiness report that fails an accessibility scan argues against
      # its own tool. The script renders a fixture carrying every status, every
      # severity, all three tile states and evidence of every shape, then runs it
      # through the same @axe-core/cli the steps above use.
      #
      # No server and no build: the report is a self-contained file, scanned over
      # file://. Gating, like the other real axe runs here. if: always() for the
      # same reason they have it — a red step above must not hide this one.
      - name: Run axe over the audit-url HTML report
        if: always()
        run: npm run --silent check:html-report -w @mattpyle/steward

      # The Nu HTML Checker over every route of the build served above, prerendered pages and the
      # on-demand /activity alike. Advisory: malformed HTML degrades the accessibility tree that
      # agents read, which is why it is checked, but it is not a reason to hold a deploy.
      #
      # `--transport jar` is explicit rather than inferred. The script falls back to POSTing each
      # document to validator.w3.org when no JRE is on PATH, which is right on a laptop and wrong
      # here: a step whose result depends on a public service's rate limiter is not a check. If
      # the Java setup above ever breaks, this must fail rather than quietly go remote.
      - name: Validate HTML (Nu HTML Checker)
        if: always()
        run: npm run --silent validate:html -- --transport jar

      # /llms.txt still conforms to llmstxt.org (v2), and every page still advertises it. The file
      # is generated from the content collections, so a generator change can break its format
      # without breaking the build; the nightly scorecard would catch that a day later, against
      # production, as a degraded metric. Advisory here, and pre-deploy.
      - name: Validate llms.txt conformance
        if: always()
        run: npm run --silent validate:llms-txt
