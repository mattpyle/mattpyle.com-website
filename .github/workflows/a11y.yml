name: Built-site checks (axe-core, HTML validity, llms.txt)

# Everything that needs a real production build served over HTTP. The accessibility audits came
# first and are still the bulk of it; the HTML validity run and the llms.txt conformance assertion
# joined on 2026-08-17 because they need exactly the same two things, a build and a server.
#
# Three jobs run at the same time, one per audit, and each builds and serves the site for itself
# through `.github/actions/serve-built-site`:
#
#   axe-cli         the axe-core CLI audit, then the audit-url report scan, the HTML validity run
#                   and the llms.txt assertion
#   axe-playwright  the Playwright axe audit (retro appearance, 320px scroll regions), then the
#                   aria goldens on master
#   guard           the Playwright guard checks, in two shards on two runners
#
# They were one job running the three audits in sequence (127 seconds on master, 63 of them the
# audits). Starting the three as concurrent processes in that one job was tried first and measured:
# on one runner the audits took 35, 35 and 52 seconds together against 17, 16 and 30 apart, so the
# step saved 11 seconds and the job still took 113. The audits compete for the runner's cores.
# Three runners do not. A build is 9 seconds, so each job builds for itself; handing one build to
# the others as an artifact would put a second `npm ci` ahead of the slowest audit. After:
# AFTER-TIMINGS.
#
# Which jobs gate: `axe-cli` and `axe-playwright`, the axe runs and the audit-url report scan. The
# guard, the HTML validity run and the llms.txt assertion are advisory — red on the PR, deploys
# proceed — in the same spirit as spellcheck.
#
# Routing. On a pull request, the three jobs run only when the change can reach the built site. The
# `changes` job asks `scripts/route-changes.sh`, the script `ci.yml` calls for its own suites,
# and they run when the `site` output is true. `ci.yml`'s header holds the table of which
# paths set it. A Markdown-only or Steward-only pull request skips the build and the audits.
# A push to `master` always runs them: `golden-drift` and the golden-drift issue read the push
# run. Both workflows share the one script because two copies of the table drifted apart once.
#
# The jobs are skipped by a job-level `if`, not by `on.paths`, so they show as skipped on the pull
# request instead of vanishing. The only required check on `master` is "Private paths not
# tracked" (ruleset `protect-master`), so a skipped job blocks no merge.

on:
  push:
    branches: [master]
  pull_request:

# The jobs build the site, serve it locally and audit it; nothing writes
# through the token. Stated explicitly rather than inherited, matching
# security-scan.yml. The gating @axe step reports as a check run, which needs no
# token permission of its own.
permissions:
  contents: read

jobs:
  changes:
    name: Route by changed paths (built site)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      site: ${{ steps.route.outputs.site }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Sort changed files into site, steward and browser
        id: route
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/route-changes.sh "$EVENT_NAME" "$BASE_SHA"

  axe-cli:
    name: axe-core CLI audit and validators
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Java for the Nu HTML Checker below. No Playwright: this job drives Chrome through
      # @axe-core/cli and chromedriver.
      - name: Build and serve the site
        uses: ./.github/actions/serve-built-site
        with:
          java: 'true'

      - name: Print Chrome & chromedriver versions
        run: |
          google-chrome-stable --version
          npx chromedriver --version

      # No --browser flag: omitting it is how @axe-core/cli selects headless
      # Chrome (the only mode that launches on a display-less runner). Passing
      # the literal string "chrome-headless" is NOT a valid --browser value —
      # parseBrowser() only accepts chrome/firefox/ie/safari/edge and throws
      # "Unknown browser" on anything else; "chrome-headless" is purely the
      # internal default it falls back to when the flag is absent.
      #
      # This audits what the server sends, which is always modern: retro is a persisted
      # client-side preference, and @axe-core/cli has no hook to run a script before it scans.
      # The `axe-playwright` job audits the second appearance.
      - name: Run axe-core accessibility audit
        run: |
          npm run --silent a11y:axe -- \
            --exit \
            http://localhost:4321/ \
            http://localhost:4321/about \
            http://localhost:4321/writing \
            http://localhost:4321/projects \
            http://localhost:4321/changelog \
            http://localhost:4321/changelog/public-scorecard/ \
            http://localhost:4321/scorecard \
            http://localhost:4321/activity \
            http://localhost:4321/steward \
            http://localhost:4321/webmcp \
            http://localhost:4321/audit \
            'http://localhost:4321/audit?url=https://example.com' \
            'http://localhost:4321/audit?url=file:///etc/hosts' \
            http://localhost:4321/writing/accessibility-and-ai/             http://localhost:4321/404

      # Steward's `audit-url` HTML report is a page this repo ships too, and an
      # agent-readiness report that fails an accessibility scan argues against
      # its own tool. The script renders a fixture carrying every status, every
      # severity, all three tile states and evidence of every shape, then runs it
      # through the same @axe-core/cli the step above uses.
      #
      # No server and no build: the report is a self-contained file, scanned over
      # file://. Gating, like the other real axe runs here. if: always() because a red
      # step above must not hide this one.
      - name: Run axe over the audit-url HTML report
        if: always()
        run: npm run --silent check:html-report -w @mattpyle/steward

      # The Nu HTML Checker over every route of the build served above, prerendered pages and the
      # on-demand /activity alike. Advisory: malformed HTML degrades the accessibility tree that
      # agents read, which is why it is checked, but it is not a reason to hold a deploy.
      #
      # `--transport jar` is explicit rather than inferred. The script falls back to POSTing each
      # document to validator.w3.org when no JRE is on PATH, which is right on a laptop and wrong
      # here: a step whose result depends on a public service's rate limiter is not a check. If
      # the Java setup ever breaks, this must fail rather than quietly go remote.
      - name: Validate HTML (Nu HTML Checker)
        if: always()
        run: npm run --silent validate:html -- --transport jar

      # /llms.txt still conforms to llmstxt.org (v2), and every page still advertises it. The file
      # is generated from the content collections, so a generator change can break its format
      # without breaking the build; the nightly scorecard would catch that a day later, against
      # production, as a degraded metric. Advisory here, and pre-deploy.
      - name: Validate llms.txt conformance
        if: always()
        run: npm run --silent validate:llms-txt

  axe-playwright:
    name: axe-core Playwright audit and goldens
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    outputs:
      golden: ${{ steps.golden.outcome }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and serve the site
        uses: ./.github/actions/serve-built-site
        with:
          playwright: 'true'

      # The CLI job audits what the server sends, which is always modern. The site's second
      # appearance — the one carrying the guest book, the webmaster note and the web ring, all
      # `display: none` in modern — is audited here instead, by @axe-core/playwright, same
      # axe-core 4.12.1, against this job's build on this job's server. Gating, not advisory: this
      # is a real axe run, it is just driven by a browser that can set localStorage before the
      # first paint.
      #
      # @axe selects two specs, not one. tests/a11y/scrollable-region.spec.ts joined the tag on
      # 2026-09-03: it asserts axe's `scrollable-region-focusable` (serious) at 320px, the width
      # the CLI never audits, by measuring scrollWidth against clientWidth rather than by
      # injecting axe. Same class of finding, same gate. Both are dropped from the `guard` job by
      # its --grep-invert, so each scan runs once per workflow.
      #
      # a11y:run, not a11y: the build above is this commit's build, already served on 4321.
      # A11Y_REUSE_SERVER tells playwright.config.ts to use that server rather than start a second
      # one on the same port and fail.
      - name: Run axe-core accessibility audit (retro appearance, and 320px scroll regions)
        env:
          A11Y_REUSE_SERVER: '1'
        run: npm run --silent a11y:run -- --grep @axe

      # The @golden snapshots the `guard` job drops, run on master only. A content or component
      # change that moves a golden is usually intended, so it stays off the PR gate; but nothing
      # else runs them in CI, and a drifted golden turns every local `npm run a11y` red until
      # someone regenerates it. On a push to master the drift surfaces once, against the merge
      # that caused it, and the golden-drift job below files it as an issue. continue-on-error
      # keeps master's check green; the outcome travels as a job output.
      - name: Run aria goldens (master only)
        id: golden
        if: always() && github.event_name == 'push'
        continue-on-error: true
        env:
          A11Y_REUSE_SERVER: '1'
        run: npm run --silent a11y:run -- --grep @golden

  guard:
    name: Playwright accessibility guard (${{ matrix.shard }}/2)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    # Two shards, each on its own runner: the 212 specs take 33 to 41 seconds on one, which made
    # this the slowest of the three jobs. Playwright splits the tests between the shards, and no
    # spec depends on another.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build and serve the site
        uses: ./.github/actions/serve-built-site
        with:
          playwright: 'true'

      # The deterministic WCAG checks axe and Lighthouse defer to manual review:
      # keyboard order, focus visibility, ClientRouter focus, 320px reflow,
      # reduced motion, and self-animation on load (the one that made the axe
      # step flake). The specs are in tests/a11y/, one file per check, and
      # each carries what it asserts and why in its own docblock.
      #
      # --grep-invert drops two families. @golden is the aria snapshots: they match their golden as
      # a subset, so they are blind to additions and belong on the master run with a human reading
      # the diff, not on a per-PR gate. @axe is the retro scan and the 320px scroll-region check,
      # which run as their own gating job; leaving them in would scan every retro route twice and
      # report a real axe violation as an advisory one.
      - name: Run accessibility guard checks (Playwright)
        env:
          A11Y_REUSE_SERVER: '1'
        run: npm run --silent a11y:run -- --grep-invert "@golden|@axe" --shard=${{ matrix.shard }}/2

  # Files a failed master golden run as one open issue, and comments on it at most once per 20
  # hours while later merges keep failing, so a drift is a single thread rather than one issue per merge. A job of its own so
  # that `issues: write` never reaches the job that builds and runs this repo's code.
  golden-drift:
    needs: axe-playwright
    if: always() && github.event_name == 'push' && needs.axe-playwright.outputs.golden == 'failure'
    runs-on: ubuntu-latest
    # One run at a time: two master pushes seconds apart both searched for an open issue, found none, and each filed one.
    concurrency:
      group: golden-drift
      cancel-in-progress: false
    permissions:
      issues: write
    steps:
      - name: Open or update the golden-drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          title="Aria golden drift on master"
          body="The @golden aria snapshots failed on ${SHA}: ${RUN_URL}

          Read the diff in the run log. An intended page change gets a new golden with \`npm run a11y -- --update-snapshots --grep <template>\`; a regression gets a fix to the page."
          existing=$(gh issue list --state open --search "in:title \"$title\"" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            # One comment per 20 hours while the same drift persists. The issue already names the
            # first failing merge, and a comment on every later push buried it: eight in one evening
            # on 2026-10-23. Each push's run is still linked from the Actions tab.
            last=$(gh issue view "$existing" --json comments --jq '[.comments[].createdAt] | max // empty')
            if [ -n "$last" ] && [ $(( $(date +%s) - $(date -d "$last" +%s) )) -lt 72000 ]; then
              echo "Drift already reported on #$existing at $last; not commenting again within 20 hours."
              exit 0
            fi
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
