- main:
  - heading "WebMCP" [level=1]
  - paragraph: Six typed tools this page hands to an agent, and what they return.
  - text: The same tools, as data
  - link "webmcp/tools.json":
    - /url: /webmcp/tools.json
  - link "webmcp/index.json":
    - /url: /webmcp/index.json
  - region "Where the standard stands today":
    - heading "Where the standard stands today" [level=2]
    - term: Spec status
    - definition:
      - text: A
      - link "Draft Community Group Report":
        - /url: https://webmachinelearning.github.io/webmcp/
      - text: of the W3C Web Machine Learning Community Group.
    - term: Browser support
    - definition:
      - text: An
      - link "origin trial in Chrome":
        - /url: https://developer.chrome.com/docs/ai/webmcp
      - text: /from version \d+\. No other engine implements it\./
    - term: This site's token
    - definition:
      - text: Expires
      - time: /\d+ \w+ \d+/
      - text: . After that Chrome ignores it and the tools stop registering.
    - term: Discovery
    - definition: Registration is the JavaScript API alone. The JSON endpoints here are this site's own convention.
  - region "What WebMCP is":
    - heading "What WebMCP is" [level=2]
    - paragraph:
      - text: "An agent driving an ordinary web page has to infer everything: which element is the search box, what a button does, whether a click worked. WebMCP replaces the inference with a contract. A page calls"
      - code: registerTool
      - text: with a name, a description, and a JSON Schema for its inputs; the agent gets a function it can call and a return value it can parse. The same shape the Model Context Protocol gives a server-side tool, running in the page, with the page's own data and the visitor's own session.
    - paragraph:
      - text: Registration is feature-detected and additive. In a browser with no
      - code: modelContext
      - text: — which today is every browser except Chrome with the trial — the code returns immediately, writes no DOM and reads no layout. Remove the tools and the site is byte-for-byte what it was.
  - region "The tool catalog":
    - heading "The tool catalog" [level=2]
    - article:
      - heading "describe_site" [level=3]
      - text: read 1 of 6
      - paragraph: "Describe mattpyle.com: who the author is, what the site is, and which sections it has. Call this first for context about the site you're on."
      - text: Returns
      - paragraph: An object with person, site, and sections.
      - paragraph:
        - text: How an agent calls it
        - button "Copy"
      - 'region "Snippet: how an agent calls describe_site"':
        - code: "const tool = (await document.modelContext.getTools()).find(t => t.name === 'describe_site'); await document.modelContext.executeTool(tool, '{}');"
      - paragraph: No inputs. Call it as-is.
      - button "Run describe_site"
      - paragraph:
        - text: Output
        - status: not run yet
      - region "Output from describe_site": // Nothing has been called yet.
    - status
  - region "How an agent uses them":
    - heading "How an agent uses them" [level=2]
    - paragraph:
      - text: Every page registers the tools on
      - code: document.modelContext
      - text: as it loads, including after a client-side navigation. An agent in the browser discovers them there and invokes one by name. Nothing is exposed over the network, there is no endpoint and no authentication — the tools live in the page you already have open.
    - paragraph:
      - text: Arguments go over as a
      - strong: JSON string
      - text: ", not an object; passing an object throws"
      - code: Failed to parse input arguments
      - text: . Results come back as a JSON string too.
    - paragraph:
      - text: "Chrome does not enforce the declared input schema, so every handler validates its own inputs: clamping"
      - code: limit
      - text: ", rejecting a blank query, falling back to modern for an unknown mode, trimming an over-long guest-book entry to the limits the visible form enforces."
  - region "Testing them yourself":
    - heading "Testing them yourself" [level=2]
    - paragraph: The run controls above work in any browser with no setup, because they call the handler directly. What they do not exercise is the protocol.
    - paragraph:
      - text: "/For that: Chrome \\d+ or later with the WebMCP origin trial,/"
      - code: chrome://flags/#enable-webmcp-testing
      - text: ", and a client on the agent side — the Model Context Tool Inspector extension is the straightforward one."
    - paragraph:
      - text: /All six tools have been driven that way on Chrome \d+\.\d+\.\d+\.\d+, against this production site\. The read tools returned what the page renders,/
      - code: set_appearance
      - text: flipped that browser's view, and
      - code: sign_guestbook
      - text: wrote an entry that appeared while the guest book was open, badged as agent-written.
  - region "Machine-readable resources":
    - heading "Machine-readable resources" [level=2]
    - 'link "/webmcp/tools.json The tool manifest: names, descriptions, input schemas, and an example call for each. Generated from the real tool objects at build time."':
