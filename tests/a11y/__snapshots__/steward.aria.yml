- main:
  - heading "Steward" [level=1]
  - paragraph: The auditor behind the steward-audit User-Agent, and the agent that publishes this site.
  - text: Audit endpoint
  - link "www.mattpyle.com/mcp":
    - /url: https://www.mattpyle.com/mcp
  - region "Did Steward just fetch your site?":
    - heading "Did Steward just fetch your site?" [level=2]
    - paragraph: Then somebody asked for a report on it. Steward reads what a site says about itself over plain HTTP, writes the report for whoever ran it, and leaves. It does not index anything and it does not come back on a schedule.
    - table "What one Steward request is":
      - caption: What one Steward request is
      - rowgroup:
        - row "User-Agent steward-audit/0.2.0 (+https://www.mattpyle.com/steward)":
          - rowheader "User-Agent"
          - cell "steward-audit/0.2.0 (+https://www.mattpyle.com/steward)":
            - code: steward-audit/0.2.0 (+https://www.mattpyle.com/steward)
        - row "robots.txt token steward-audit":
          - rowheader "robots.txt token"
          - cell "steward-audit":
            - code: steward-audit
        - row "Cost of one audit Roughly a dozen HTTP requests over a few seconds. A deep audit adds up to three of your pages opened in a real browser, which fetch their own subresources the way any visitor's browser does.":
          - rowheader "Cost of one audit"
          - cell "Roughly a dozen HTTP requests over a few seconds. A deep audit adds up to three of your pages opened in a real browser, which fetch their own subresources the way any visitor's browser does."
        - row "Frequency Once, when a person or an agent asks. No schedule, no repeat visits, no crawl.":
          - rowheader "Frequency"
          - cell "Once, when a person or an agent asks. No schedule, no repeat visits, no crawl."
        - row "What it collects Your public documents — robots.txt, the sitemap, llms.txt, agents.md, the well-known discovery documents — and the headers of a couple of pages. Nothing is stored here and nothing is published anywhere.":
          - rowheader "What it collects"
          - cell "Your public documents — robots.txt, the sitemap, llms.txt, agents.md, the well-known discovery documents — and the headers of a couple of pages. Nothing is stored here and nothing is published anywhere."
    - paragraph:
      - strong: It obeys your robots.txt.
      - text: Every URL is checked against your rules before it is requested; only
      - code: /robots.txt
      - text: is fetched without asking. Anything you disallow is reported as “not checked”, never as a finding against your site.
    - heading "How to refuse it" [level=3]
    - code: "User-agent: steward-audit Disallow: /"
    - paragraph: One audit then costs you one request — robots.txt, read once. Nothing else about how this site treats you changes.
  - region "What Steward is":
    - heading "What Steward is" [level=2]
    - paragraph: Steward is this site's editorial agent. It reviews a draft — spelling, prose linting, an editorial pass, a real production build with accessibility and performance audits — waits durably for Matt to approve it, publishes by pull request, then verifies production. The agent-readiness audit started as one step of that review and turned out to be the half worth pointing at other people's sites.
    - paragraph:
      - text: It checks behaviour rather than presence. A
      - code: "200"
      - text: from
      - code: "/llms.txt"
      - text: that is really the site's HTML 404 page is a failure here — the most common way a site passes a presence check while giving an agent nothing.
    - text: /Fast tier \d+ checks over plain HTTP\. Seconds, and the report comes back in the call\. Deep tier Up to three pages opened in a real browser, reporting Lighthouse scores and axe-core violations\. Minutes, and capped far harder\./
  - region "What the audit checks":
    - heading "What the audit checks" [level=2]
    - text: /\d+ checks, \d+ categories, no composite score\./
    - heading "Crawlability" [level=3]
    - paragraph: What the site says an agent may do.
    - paragraph: /\d+ checks/
    - list "Crawlability":
      - listitem: robots.txt exists and parses · medium
      - listitem: robots.txt lets user-triggered AI agents read the site · high
      - listitem: Content Signals preferences are declared · low
      - listitem: A sitemap is declared in robots.txt and fetchable · high
    - heading "Discovery" [level=3]
    - paragraph: What an agent can find without being told where to look.
    - paragraph: /\d+ checks/
    - list "Discovery":
      - listitem: llms.txt exists and follows the spec · medium
      - listitem: The links in llms.txt resolve · medium
      - listitem: Every llms.txt list item leads with a markdown link · low
      - listitem: agents.md exists and is markdown · medium
      - listitem: An MCP server is discoverable at /.well-known/mcp-server · low
      - listitem: An A2A agent card is published · low
    - heading "Content access" [level=3]
    - paragraph: Whether the content comes back in a form a model can read.
    - paragraph: /\d+ checks/
    - list "Content access":
      - listitem: The homepage serves markdown when asked for it · high
      - listitem: A content page serves markdown when asked for it · high
      - listitem: The homepage advertises its alternates in a Link header · low
  - region "Running an audit yourself":
    - heading "Running an audit yourself" [level=2]
    - paragraph:
      - text: Point an MCP client at
      - code: https://www.mattpyle.com/mcp
      - text: — a stateless streamable-HTTP server with three tools. No account, no key.
      - code: audit_site(url)
      - text: runs the fast checks and the report comes back in the call, with nothing to poll.
    - paragraph:
      - text: "Two renderings ship in one response: the canonical JSON in"
      - code: structuredContent
      - text: ", one entry per check with its evidence, and the same report as a markdown summary in the text content. A"
      - code: GET
      - text: "on"
      - link "the endpoint itself":
        - /url: https://www.mattpyle.com/mcp
      - text: answers
      - code: "405"
      - text: "with a worked example rather than a bare status. The unit audited is a site, not a page: any path in the URL is ignored, only"
      - code: http
      - text: and
      - code: https
      - text: are accepted, and addresses on private networks are refused before a connection is opened. The site's own discovery document is at
      - link "/.well-known/mcp-server":
        - /url: /.well-known/mcp-server
      - text: "; it describes the fast tier, and"
      - code: tools/list
      - text: enumerates the rest.
    - heading "The deep tier" [level=3]
    - paragraph:
      - text: A deep audit takes longer than any MCP client holds a tool call open, so
      - code: deep_audit(url)
      - text: returns a workflow ID straight away and
      - code: get_audit(workflowId, view)
      - text: reads it back — there are no findings in the
      - code: deep_audit
      - text: response, and it says so. Poll
      - code: "view: \"status\""
      - text: until
      - code: done
      - text: is true, then read
      - code: "view: \"report\""
      - text: for the canonical JSON or
      - code: "\"summary\""
      - text: for markdown. While it runs, the status view lists each unit of work with its state, and anything being retried carries its attempt number, straight from Temporal rather than from a count kept by hand.
    - term: Queued means queued
    - definition: One worker sits behind this endpoint, so a busy moment is a real wait rather than a slow site. The status view answers queued with a position rather than leaving you to guess.
    - term: Incomplete says so
    - definition: A deep audit that sampled pages and rendered none of them comes back marked degraded, naming which half is missing and which half can still be read.
    - term: Durable either way
    - definition: A run survives a worker restart, and the workflow ID keeps answering.
    - paragraph:
      - strong:
        - text: Powered by
        - link "Temporal":
          - /url: https://temporal.io
        - text: .
      - text: Matt works at Temporal, so that is disclosure as much as it is a credit.
    - text: Fast audit
    - region "Fast audit":
      - code: "curl -sS https://www.mattpyle.com/mcp \\ -H 'Content-Type: application/json' \\ -H 'Accept: application/json, text/event-stream' \\ -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\", \"params\":{\"name\":\"audit_site\",\"arguments\":{\"url\":\"example.com\"}}}'"
    - text: Deep audit
    - region "Deep audit":
      - code: "curl -sS https://www.mattpyle.com/mcp \\ -H 'Content-Type: application/json' \\ -H 'Accept: application/json, text/event-stream' \\ -d '{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"tools/call\", \"params\":{\"name\":\"deep_audit\",\"arguments\":{\"url\":\"example.com\"}}}'"
    - text: Rate limits
    - table "Rate limits":
      - rowgroup:
        - row "Tier Scope Cap Window":
          - columnheader "Tier"
          - columnheader "Scope"
          - columnheader "Cap"
          - columnheader "Window"
      - rowgroup:
        - row /Fast Per caller \d+ One hour/:
          - cell "Fast"
          - cell "Per caller"
          - cell /\d+/
          - cell "One hour"
        - row /Fast Everyone together \d+ One UTC day/:
          - cell "Fast"
          - cell "Everyone together"
          - cell /\d+/
          - cell "One UTC day"
        - row /Deep Per caller \d+ One UTC day/:
          - cell "Deep"
          - cell "Per caller"
          - cell /\d+/
          - cell "One UTC day"
        - row /Deep Everyone together \d+ One UTC day/:
          - cell "Deep"
          - cell "Everyone together"
          - cell /\d+/
          - cell "One UTC day"
    - paragraph:
      - text: A refusal is a JSON-RPC error with a
      - code: Retry-After
      - text: header naming which limit was hit and how long to wait. Every accepted call spends a dozen requests at somebody else's origin under this site's name; an unbounded endpoint would be an open relay with an honest User-Agent. The deep limits are two orders of magnitude smaller because a deep audit spends minutes of browser time on a machine somebody pays for. The counters hold a keyed hash of the caller's address with a lifetime no longer than the window, never the address itself. There is no key and no way to ask for more.
      - code: get_audit
      - text: "is free: it reads a run you already paid for and makes no request at anybody's origin."
  - region "Contact":
    - heading "Contact" [level=2]
    - paragraph: If Steward misbehaved on your site — ignored a rule, requested something it should not have, or reported something that is not true — open an issue. It is the same repository the auditor's code lives in, and it is read.
    - link "Open an issue":
      - /url: https://github.com/mattpyle/mattpyle.com-website/issues
    - text: Steward is an experiment on a personal site, not a supported service. It may change or be withdrawn without notice.
