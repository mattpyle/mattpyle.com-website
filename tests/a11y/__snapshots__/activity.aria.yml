  - region "Signers":
    - heading "Signers" [level=2]
    - table:
      - rowgroup:
        - row "Host 7 days 30 days":
          - columnheader "Host"
          - columnheader "7 days"
          - columnheader "30 days"
      - rowgroup:
        - row "· · ·":
          - cell "·"
          - cell "·"
          - cell "·"
    - paragraph: Each row is a Web Bot Auth signature that verified against the key directory at this host, from a signer this site does not yet name. The host is the operator's domain, recorded alone; a signer this site names appears under its own name in By client.
  - region "MCP clients":
    - heading "MCP clients" [level=2]
    - table:
      - rowgroup:
        - row "Client Protocol version 7 days 30 days":
          - columnheader "Client"
          - columnheader "Protocol version"
          - columnheader "7 days"
          - columnheader "30 days"
      - rowgroup:
        - row "· · · ·":
          - cell "·"
          - cell "·"
          - cell "·"
          - cell "·"
    - paragraph: "Each row is a client that identified itself to /mcp: the name it gave itself and the protocol revision it asked for. A 2025-era client gives both in its initialize request, once per session; a 2026-07-28 client gives them in the _meta envelope of every request, so its row counts requests. The client chooses both, so a row shows what a piece of software says it is, not who runs it."
  - region "MCP methods":
    - heading "MCP methods" [level=2]
    - table:
      - rowgroup:
        - row "Method 7 days 30 days":
          - columnheader "Method"
          - columnheader "7 days"
          - columnheader "30 days"
      - rowgroup:
        - row "· · ·":
          - cell "·"
          - cell "·"
          - cell "·"
    - paragraph: Every POST to /mcp counts once under its JSON-RPC method, whether the server answered it or refused it. other-method covers any method not listed, a notification, and a body that is not a JSON-RPC request. server/discover is the discovery request of the 2026-07-28 protocol revision.
  - region "A2A methods":
    - heading "A2A methods" [level=2]
    - table:
      - rowgroup:
        - row "Method 7 days 30 days":
          - columnheader "Method"
          - columnheader "7 days"
          - columnheader "30 days"
      - rowgroup:
        - row "· · ·":
          - cell "·"
          - cell "·"
          - cell "·"
    - paragraph: Every POST to /a2a counts once under its JSON-RPC method, whether the endpoint answered it or refused it. SendMessage, GetTask and CancelTask are the three methods it implements, and their pre-1.0 spellings count under them. other-method is any method not listed, and a body that is not a JSON-RPC request. unparsed is a body that was not JSON at all.
  - region "A2A skills and tiers":
    - heading "A2A skills and tiers" [level=2]
    - table:
      - rowgroup:
        - row "Value Kind 7 days 30 days":
          - columnheader "Value"
          - columnheader "Kind"
          - columnheader "7 days"
          - columnheader "30 days"
      - rowgroup:
        - row "· · · ·":
          - cell "·"
          - cell "·"
          - cell "·"
          - cell "·"
    - paragraph: "Each SendMessage that carries text counts once under the skill it routed to, and an audit request counts once under the tier it asked for: fast answers in the call, deep starts a durable workflow and is the costly path. none is a request that routed to no skill, such as a GetTask or a malformed message."
